name: Validate Robinleo Atlas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate public site
        run: |
          node museum-build.cjs
          node museum-validate.cjs
          git diff --exit-code
      - name: Check legacy assets
        run: |
          test -s persona-distill/index.html
          test -s assets/site.css
          test -s assets/site.js
          test -s assets/characters/suoming.webp
          test -s assets/characters/xilian.webp
          test -s assets/characters/alipay-qr.jpg
          test -s assets/characters/sanyueqi.png
          test -s assets/characters/changyeyue.svg
          test -s assets/characters/aimisi.svg
