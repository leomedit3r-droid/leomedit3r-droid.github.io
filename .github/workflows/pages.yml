name: Deploy Persona Distill to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate published files
        run: |
          test -s index.html
          test -s assets/site.css
          test -s assets/site.js
          grep -q 'chat.deepseek.com/share/wrhd0bd8jqmj3z5mjm' index.html
          grep -q 'chat.deepseek.com/share/c2l21x4nznauhoktkh' index.html

      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
