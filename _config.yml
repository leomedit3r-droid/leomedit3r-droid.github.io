# GitHub Pages / Jekyll configuration
title: Robinleo Atlas
description: Independent creator and digital museum
url: https://leomedit3r-droid.github.io
lang: zh-CN
markdown: kramdown

# Keep legacy Hexo scaffolding and generated archives out of the public site.
exclude:
  - node_modules
  - public
  - source
  - scaffolds
  - db.json
  - package.json
  - package-lock.json
  - ASSET_UPLOAD.md
  - SITE_PREVIEW.md
  - README.md
  - .deploy_git

  - museum-build.cjs
  - data
  - docs

  - museum-validate.cjs
  - HANDOFF.md
